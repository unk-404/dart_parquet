name: parquet
description: Pure Dart Apache Parquet reader and writer with VM and Web support.
version: 0.1.2
repository: https://github.com/unk-404/dart_parquet
issue_tracker: https://github.com/unk-404/dart_parquet/issues

topics:
  - parquet
  - apache-parquet
  - columnar
  - web

environment:
  sdk: ^3.13.5

dependencies:
  blit: ^0.1.6
  snappy_neo: ^0.1.2
  zstd_neo: ^0.1.2
  brotli_neo: ^0.1.2
  lzo_neo: ^0.1.2
  dart_lz4: ^1.4.0
  just_deflate: ^0.1.0

dev_dependencies:
  benchmark_test: ^0.1.2
  lints: ^6.0.0
  test: ^1.25.6

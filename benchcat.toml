[font]
family = ["mplus-rounded"]
enable_guaranteed_font = false
enable_system_font = false

[render]
title = "parquet-dart benchmarks"
subtitle = "{platform|local} · commit {commit}"
footer = "Generated from {rows} rows"
width = 920
theme = "pastel"
max_rows = 20

[[series]]
label = "JIT"
input = "build/bench/jit.jsonl"
color = "#7FD1B9"

[[series]]
label = "AOT"
input = "build/bench/aot.jsonl"
color = "#8CB8F0"

[[series]]
label = "Rust"
input = "build/bench/rust.jsonl"
color = "#F2B880"


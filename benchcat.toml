[font]
family = ["mplus-rounded"]
enable_guaranteed_font = false
enable_system_font = false

[render]
title = "parquet-dart benchmarks"
subtitle = "{platform|local} · Dart {tool_version} · commit {commit}"
footer = "Generated from {rows} rows"
width = 920
theme = "pastel"
max_rows = 12

[[series]]
label = "JIT"
input = "build/bench/jit.jsonl"
color = "#7FD1B9"

[[series]]
label = "AOT"
input = "build/bench/aot.jsonl"
color = "#8CB8F0"

[[row]]
id = "read read.flat.snappy"
label = "Flat read · Snappy"
value = "value * 3.6983"
unit = "MiB/s"
group = "Read"

[[row]]
id = "read read.flat.zstd"
label = "Flat read · Zstd"
value = "value * 3.6983"
unit = "MiB/s"
group = "Read"

[[row]]
id = "read read.flat.brotli"
label = "Flat read · Brotli"
value = "value * 3.6983"
unit = "MiB/s"
group = "Read"

[[row]]
